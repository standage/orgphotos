name: CI Build

defaults:
  run:
    shell: bash -l {0}  # Critical for activating Conda environment

on:
  push:
  schedule:
    - cron: '0 4 1 * *'

jobs:
  build:
    name: orgphotos build (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v1
      - uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          channels: conda-forge, defaults
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Test with pytest
        run: |
          make test
      - name: Style check
        run: |
          make style
